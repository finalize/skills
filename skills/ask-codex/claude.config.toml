# Claude Code から `codex exec -p claude` で呼ぶとき専用のプロファイル。
# 対話用の ~/.codex/config.toml は変更しない(これを上に重ねるだけ)。
# 実体はこのスキルの中にあり、install.sh が ~/.codex/claude.config.toml から symlink する。
# model は書かない。~/.codex/config.toml のものに従う。
model_reasoning_effort = "max"
approval_policy = "never"
notify = []

# 読み書きの範囲は permissions で決める(下の claude-read と claude-write)。
# sandbox_mode をどこかの設定に書くか、--sandbox(-s)を渡すと、Codex は古い設定に切り替わり、
# ここに書いた読めなくする決まりが効かなくなる。sandbox_mode は書かない(ask.sh は、見つけたら止まる)。
default_permissions = "claude-read"

# MCP はここでは切らない。ask.sh が、Codex から見える MCP を呼び出しのたびに全部切る。
# ここに [mcp_servers.<名前>] を書くと、その MCP が無い Mac では「invalid transport」で落ちる(2026-11-20)。

# プラグインは名前で切る。入っていない名前を書いても害は無い。
# ask.sh は、~/.codex/config.toml で有効なプラグインのうち、ここで切っていないものがあれば、呼ばずに止まって足す行を出す。
[plugins."browser@openai-bundled"]
enabled = false

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."unified-computer-use@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = false

[plugins."codex-app-tools@openai-bundled"]
enabled = false

[plugins."figma@openai-curated"]
enabled = false

# 文書を読み書きするプラグイン。シェルのコマンドとは別の経路でファイルを開けるかもしれないので切る
[plugins."documents@openai-primary-runtime"]
enabled = false

[plugins."pdf@openai-primary-runtime"]
enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."template-creator@openai-primary-runtime"]
enabled = false

# 読むだけ。読める範囲は read-only と同じ(ディスク全体)で、秘密の置き場と、docs の下に置かれた資料だけを読めなくする。
# Claude Code の .claude/settings.json の除外は Codex には効かないので、同じものをここで止める。
# 止めているのは、Codex が動かすコマンドだけ。Codex の Web 検索は OpenAI の側で動く。
# 止めているのは決まった名前と場所だけなので、ほかの名前で置いた秘密は読める。
[permissions.claude-read]
description = "Claude Code から頼む読むだけの仕事。秘密の置き場と、docs の下の資料は読めない"
extends = ":read-only"

# 場所で止める。ask.sh は、-C がこの中を指していたら止まる(作業のディレクトリにすると、読めるようになるため)。
# 場所を書くのは、このファイルだけ。ほかの設定(~/.codex/config.toml、リポジトリの .codex/config.toml)が
# claude-read / claude-write に触れていると、deny を足すだけでも ask.sh は止まる。
# 足したら SKILL.md の「守ること」の確かめ方で、止まるのを見る。
# シェルの起動ファイル(~/.zshrc など)は止めていない。止めると、Codex が動かすシェルの PATH が壊れる。
[permissions.claude-read.filesystem]
"~/.ssh" = "deny"
"~/.aws" = "deny"
"~/.config/gcloud" = "deny"
"~/.config/gh" = "deny"
"~/.docker/config.json" = "deny"
"~/.netrc" = "deny"
"~/.git-credentials" = "deny"
"~/.npmrc" = "deny"
"~/.kube" = "deny"
"~/.gnupg" = "deny"
# Codex 自身と Claude Code の認証・設定と、その写し
"~/.codex/auth.json" = "deny"
"~/.claude.json" = "deny"
"~/.claude.json.backup" = "deny"
"~/.claude/backups" = "deny"
# 会話の記録と、打ったプロンプト(読んだファイルの抜粋や、貼り付けた秘密が入りうる)。
# file-history は Claude Code が書き換える前のファイルの写しで、名前がハッシュになるので、下の名前の決まりが効かない。
# Codex の記録のうち、SQLite のファイル(~/.codex/*.sqlite)は止めていない(何が入っているかを確かめていない)
"~/.claude/projects" = "deny"
"~/.claude/history.jsonl" = "deny"
"~/.claude/file-history" = "deny"
"~/.claude/paste-cache" = "deny"
"~/.codex/history.jsonl" = "deny"
"~/.codex/sessions" = "deny"
"~/.codex/archived_sessions" = "deny"
# シェルの履歴。zsh は HISTFILE で場所が変わる(~/.zhistory にしている環境があった)。
# ~/.zsh_sessions は、macOS のターミナルがセッションごとに残す履歴
"~/.zsh_history" = "deny"
"~/.zhistory" = "deny"
"~/.zsh_sessions" = "deny"
"~/.bash_history" = "deny"
# Cloudflare のログインの置き場。wrangler と、cf CLI(macOS で見た場所。中に oauth_token と refresh_token があった)
"~/.wrangler" = "deny"
"~/.config/.wrangler" = "deny"
"~/Library/Preferences/.wrangler" = "deny"
"~/Library/Preferences/cloudflare" = "deny"
# Expo のログイン(state.json)、EAS が置く Apple ID のセッション(~/.app-store)、adb の秘密鍵
"~/.expo/state.json" = "deny"
"~/.app-store" = "deny"
"~/.android/adbkey" = "deny"

# 名前で止める。ディスクのどこにあっても(作業のディレクトリの外でも)止まる。
# 名前の決まりは deny しか書けない(読めるように戻す書き方が無い)。だから .env.* をまとめては止めない。
# 変数の名前を見るための .env.example と .env.sample は読めるままにする。
[permissions.claude-read.filesystem."/"]
"**/.env" = "deny"
"**/.env.local" = "deny"
"**/.env.*.local" = "deny"
"**/.env.development" = "deny"
"**/.env.production" = "deny"
"**/.env.test" = "deny"
"**/.env.deploy" = "deny"
"**/.env.staging" = "deny"
"**/.env.stg" = "deny"
"**/.env.prod" = "deny"
"**/.env.dev" = "deny"
"**/.env.preview" = "deny"
"**/.envrc" = "deny"
"**/.dev.vars" = "deny"
"**/.dev.vars.*" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/*.p8" = "deny"
"**/*.p12" = "deny"
"**/*.pfx" = "deny"
"**/*.keystore" = "deny"
"**/*credentials*.json" = "deny"
"**/*service-account*.json" = "deny"
"**/*service_account*.json" = "deny"
"**/*serviceaccount*.json" = "deny"
"**/*firebase-adminsdk*.json" = "deny"
"**/*-sa-key*.json" = "deny"
"**/*-key.json" = "deny"
"**/*.tfvars" = "deny"
"**/*.tfstate" = "deny"
# gcloud の設定フォルダ。CLOUDSDK_CONFIG で分けた2つ目(~/.config/gcloud-<何か>)も、名前の始まりで止める。
# 場所の表に "~/.config/gcloud*" と書いても、フォルダの中は止まらなかった(2026-11-22、codex-cli 0.164.0)
"**/.config/gcloud*/**" = "deny"
# 受け取った資料(docs の下に置かれた Office の文書、PDF、表、まとめたファイル)
"**/docs/**/*.docx" = "deny"
"**/docs/**/*.doc" = "deny"
"**/docs/**/*.xlsx" = "deny"
"**/docs/**/*.xlsm" = "deny"
"**/docs/**/*.xls" = "deny"
"**/docs/**/*.csv" = "deny"
"**/docs/**/*.pdf" = "deny"
"**/docs/**/*.pptx" = "deny"
"**/docs/**/*.ppt" = "deny"
"**/docs/**/*.zip" = "deny"

# ask.sh -w のとき。claude-read の決まりのまま、作業ディレクトリと、自分用の一時ディレクトリ($TMPDIR)にだけ書ける
[permissions.claude-write]
description = "Claude Code から頼む書く仕事。作業ディレクトリと $TMPDIR にだけ書ける"
extends = "claude-read"

[permissions.claude-write.filesystem]
":tmpdir" = "write"

# .git と .codex は、Codex が初めから書けなくしている。.claude(設定とフックの置き場)も読むだけにする。
# 書けると、次の Claude Code のセッションで任意のコマンドを動かせる。
[permissions.claude-write.filesystem.":workspace_roots"]
"." = "write"
".claude" = "read"
